# Balanced small benchmark: at most 1,000 raw examples per source.
name: vlm_v2_small_3judge
judges: [granite-vision-3.3-2b, qwen2.5-vl-3b-instruct, phi-3.5-vision-instruct]
result_dir: ./result/vlm_v2_balanced_1k

data:
  builder: prepared_export
  out_dir: ./data/vlm_v2_small_export
  flat_files: true
  calibration_size: 500

scoring:
  splits: [eval_pool]
  chunk_size: 16
  max_fewshot_examples: 2

cascade:
  alpha: 0.15
  delta: 0.1
  split_delta: true

evaluate:
  experiments: [baseline_comparison]
  n_splits: 1000
  seed: 42
